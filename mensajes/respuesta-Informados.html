<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gracias por tu respuesta | IES</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7f9;font-family:Arial,Helvetica,sans-serif;color:#1f344c;padding:24px}
.card{max-width:560px;margin:60px auto;background:#fff;border:1px solid #dce8f0;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(31,52,76,.08)}
.top{height:10px;background:#00aae4}
.content{padding:44px 36px;text-align:center}
.tag{display:inline-block;background:#eaf8fd;color:#0084b1;font-size:12px;font-weight:700;letter-spacing:.8px;padding:7px 14px;border-radius:999px;margin-bottom:22px}
h1{margin:0 0 18px;color:#00aae4;font-size:28px;line-height:1.25}
p{margin:0;font-size:16px;line-height:1.7;color:#4b5965}
.footer{display:flex;height:7px}
.footer div:first-child{width:70%;background:#00aae4}
.footer div:last-child{width:30%;background:#ff6859}
.error h1{color:#ff6859}
</style>
</head>
<body>
<div class="card" id="card">
<div class="top"></div>
<div class="content">
<div class="tag">IES · MODALIDAD DISTANCIA</div>
<h1 id="titulo">Registrando tu respuesta...</h1>
<p id="mensaje">Un momento, por favor.</p>
</div>
<div class="footer">
<div></div>
<div></div>
</div>
</div>

<script>
const APP_RESPUESTAS="https://script.google.com/macros/s/AKfycbxkY7uTdoywbWNR5wrP0WRstA0SpSMPRo2M8gn6Ma48eqIw-4rBsXFr0lubQCYenKoO/exec";

const parametros=new URLSearchParams(window.location.search);

const dni=parametros.get("dni");
const email=parametros.get("email");
const motivo=parametros.get("motivo");

const card=document.getElementById("card");
const titulo=document.getElementById("titulo");
const mensaje=document.getElementById("mensaje");

function mostrarError(texto){
  card.classList.add("error");
  titulo.textContent="No pudimos registrar tu respuesta";
  mensaje.textContent=texto;
}

function mostrarExito(){
  card.classList.remove("error");
  titulo.textContent="¡Gracias por ayudarnos!";
  mensaje.textContent="Tu respuesta fue registrada. Gracias por regalarnos un minuto y ayudarnos a seguir mejorando.";
}

if(!dni || !email || !motivo){
  mostrarError("El enlace utilizado no contiene toda la información necesaria.");
}else{
  const url=
    APP_RESPUESTAS+
    "?dni="+encodeURIComponent(dni)+
    "&email="+encodeURIComponent(email)+
    "&motivo="+encodeURIComponent(motivo)+
    "&origen=informados"+
    "&t="+Date.now();

  fetch(url,{
    method:"GET",
    redirect:"follow",
    cache:"no-store"
  })
  .then(function(respuesta){
    if(!respuesta.ok){
      throw new Error("HTTP "+respuesta.status);
    }
    return respuesta.text();
  })
  .then(function(resultado){
    const texto=resultado.trim().toUpperCase();

    if(texto==="OK"){
      mostrarExito();
      return;
    }

    if(texto==="NO_ENCONTRADO"){
      mostrarError("No pudimos identificar tus datos en nuestra base.");
      return;
    }

    if(texto==="DATOS_INCOMPLETOS"){
      mostrarError("El enlace no contiene toda la información necesaria.");
      return;
    }

    if(texto==="MOTIVO_INVALIDO"){
      mostrarError("La opción seleccionada no pudo ser procesada.");
      return;
    }

    if(texto==="ERROR_HOJA"){
      mostrarError("No pudimos acceder al registro de respuestas.");
      return;
    }

    mostrarError("No pudimos confirmar que la respuesta se haya registrado.");
  })
  .catch(function(error){
    console.error(error);
    mostrarError("No pudimos registrar tu respuesta. Por favor, intentá nuevamente.");
  });
}
</script>
</body>
</html>
