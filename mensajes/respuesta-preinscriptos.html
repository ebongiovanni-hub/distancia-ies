<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gracias por tu respuesta | IES</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7f9;font-family:Arial,Helvetica,sans-serif;color:#1f344c;padding:24px}
.card{max-width:560px;margin:60px auto;background:#fff;border:1px solid #dce8f0;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(31,52,76,.08)}
.top{height:10px;background:#00aae4}
.content{padding:44px 36px;text-align:center}
.tag{display:inline-block;background:#eaf8fd;color:#0084b1;font-size:12px;font-weight:700;letter-spacing:.8px;padding:7px 14px;border-radius:999px;margin-bottom:22px}
h1{margin:0 0 18px;color:#00aae4;font-size:28px;line-height:1.25}
p{margin:0;font-size:16px;line-height:1.7;color:#4b5965}
.footer{display:flex;height:7px}
.footer div:first-child{width:70%;background:#00aae4}
.footer div:last-child{width:30%;background:#ff6859}
.error h1{color:#ff6859}
</style>
</head>
<body>

<div class="card" id="card">
<div class="top"></div>

<div class="content">
<div class="tag">IES · MODALIDAD DISTANCIA</div>

<h1 id="titulo">Registrando tu respuesta...</h1>

<p id="mensaje">
Un momento, por favor.
</p>
</div>

<div class="footer">
<div></div>
<div></div>
</div>
</div>

<form
id="formRespuesta"
method="post"
target="registroOculto"
action="https://script.google.com/macros/s/AKfycbyGF22F5jPQ_mzmOwBnxoppg_7SgexTghxSGV4h7phtZoqv7ISodE3B-Bh1Ag7B7dkt/exec"
style="display:none">

<input type="hidden" name="dni" id="dni">
<input type="hidden" name="email" id="email">
<input type="hidden" name="motivo" id="motivo">

</form>

<iframe
name="registroOculto"
id="registroOculto"
style="display:none">
</iframe>

<script>

const params=new URLSearchParams(window.location.search);

const dni=params.get("dni");
const email=params.get("email");
const motivo=params.get("motivo");

const titulo=document.getElementById("titulo");
const mensaje=document.getElementById("mensaje");
const card=document.getElementById("card");

if(!dni || !email || !motivo){

  card.classList.add("error");

  titulo.textContent="No pudimos registrar tu respuesta";

  mensaje.textContent=
    "El enlace utilizado no contiene toda la información necesaria.";

}else{

  document.getElementById("dni").value=dni;
  document.getElementById("email").value=email;
  document.getElementById("motivo").value=motivo;

  document.getElementById("formRespuesta").submit();

  setTimeout(function(){

    titulo.textContent="¡Gracias por ayudarnos!";

    mensaje.textContent=
      "Tu respuesta fue registrada. Gracias por regalarnos un minuto y ayudarnos a seguir mejorando.";

  },1000);

}

</script>

</body>
</html>
